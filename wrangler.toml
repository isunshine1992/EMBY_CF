- name: 配置 wrangler.toml
  run: |
    cat > wrangler.toml << EOF
    name = "${{ secrets.CF_WORKER_NAME }}"
    main = "worker.js"
    compatibility_date = "2024-01-01"
    account_id = "${{ secrets.CF_ACCOUNT_ID }}"

    [[d1_databases]]
    binding = "DB"
    database_name = "emby-proxy-db"
    database_id = "d4d06f0a-1490-46f5-931b-0d0db34e2f0c"
    EOF
